name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일: 러너의 새 Xcode·SDK 에서 깨지는지 먼저 알게

jobs:
  backend:
    # bin/ctxgraph.py 는 사용자의 Claude Code 훅으로 돈다: 맥에 기본으로 있는 python3(3.9)와 최신 파이썬 둘 다에서 시험
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: ["system", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - if: matrix.python != 'system'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: |
          PY=$([ "${{ matrix.python }}" = system ] && echo /usr/bin/python3 || echo python3)
          $PY --version
          cd tests && $PY -m unittest discover -s . -t . -v

  app:
    # 기본 Xcode(macos-15) 와 가장 새 Xcode(macos-26) 둘 다로 빌드 — 새 SDK·Swift 에서 깨지는 걸 먼저 알게
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, xcode: default, l10n: true }
          - { os: macos-26, xcode: pinned, l10n: false }    # 권장 버전 (.xcode-version)
          - { os: macos-26, xcode: newest, l10n: false }    # 러너의 가장 새 Xcode — 다음에 깨질 걸 먼저 보기
          - { os: macos-26, xcode: clt, l10n: false }       # Xcode 없이 Command Line Tools 만 쓰는 사람
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Pick Xcode
        if: matrix.xcode != 'default'
        run: |
          case "${{ matrix.xcode }}" in
            clt) sudo xcode-select -s /Library/Developer/CommandLineTools ;;
            pinned)
              X="/Applications/Xcode_$(tr -d '[:space:]' < .xcode-version).app"
              [ -d "$X" ] || { echo "::error::$X isn't on this runner — update .xcode-version"; ls -d /Applications/Xcode*.app; exit 1; }
              sudo xcode-select -s "$X" ;;
            newest) sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)" ;;
          esac
          xcode-select -p
      - name: Build (release layout)
        run: |
          swift --version
          ./build.sh --check
          OUT="$RUNNER_TEMP/CtxGraph.app" ./build.sh
          test -x "$RUNNER_TEMP/CtxGraph.app/Contents/MacOS/CtxGraph"
          test -f "$RUNNER_TEMP/CtxGraph.app/Contents/Resources/bin/ctxgraph.py"
          test -f "$RUNNER_TEMP/CtxGraph.app/Contents/Resources/Fonts/D2Coding.ttf"
          ! /usr/libexec/PlistBuddy -c "Print :CtxGraphSourceBin" "$RUNNER_TEMP/CtxGraph.app/Contents/Info.plist"
      - name: Build fallbacks (Xcode, older SDK, prebuilt app)
        if: matrix.l10n
        run: SKIP_SDK=1 tools/test_build.sh
      - name: Translations
        if: matrix.l10n
        run: |
          # 컴파일러가 뽑은 번역 키와 en.py 를 맞춰 본다 (빠진 번역·형식 지정자 불일치면 실패)
          cd app
          mkdir -p "$RUNNER_TEMP/strings"   # 없으면 swift 가 .stringsdata 를 못 쓴다
          swift build -c release --build-path "$RUNNER_TEMP/l10n" \
            -Xswiftc -emit-localized-strings -Xswiftc -emit-localized-strings-path -Xswiftc "$RUNNER_TEMP/strings"
          python3 -B Localization/build_strings.py "$RUNNER_TEMP/strings"
