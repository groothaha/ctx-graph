name: Toolchains

# 손으로 돌리는 점검: 러너에 있는 Xcode 들과 Intel 맥에서 빌드되는지 (gh workflow run toolchains.yml)
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, xcode: default }
          - { os: macos-15, xcode: default }
          - { os: macos-15, xcode: newest }
          - { os: macos-26, xcode: default }
          - { os: macos-26, xcode: newest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Pick Xcode
        run: |
          sw_vers -productVersion; uname -m
          ls -d /Applications/Xcode*.app || true
          if [ "${{ matrix.xcode }}" = newest ]; then
            X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
            sudo xcode-select -s "$X"
          fi
          xcode-select -p; swift --version
      - name: Build
        run: OUT="$RUNNER_TEMP/CtxGraph.app" ./build.sh
